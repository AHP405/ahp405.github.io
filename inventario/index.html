 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#eef3fb;color:#174A9C;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
 .c{max-width:420px;text-align:center}
 img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
 h1{font-size:24px;margin:16px 0 6px}
 p{font-size:16px;line-height:1.45;color:#3b557f}
 .p{background:#fff;border-radius:16px;padding:14px 16px;text-align:left;margin:16px 0}
 a.b{display:inline-block;background:#174A9C;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin-top:6px}
 /* Vista da app: l'inventario sta in un riquadro di questa pagina, così iPhone non vede cambi di sito e non mostra il browser interno.
    iOS 26 sfuma la zona dell'ora e circa 35 punti sotto (WebKit bug 330085): lì sta solo la banda blu; 22 px + i 14 di margine della testata = logo appena sotto.
    A certi avvii iOS lascia una striscia vuota sotto la pagina (WebKit bug 313800): prende lo sfondo, uguale alla lista dell'app. */
 html.app,html.app body{background:#f2f5fa}
 html.app body{height:100%;min-height:0;overflow:hidden}
 #banda{position:fixed;top:0;left:0;right:0;z-index:2;height:calc(env(safe-area-inset-top) + 22px);background:linear-gradient(90deg,#0E2345,#174A9C 85%,#2767C4)}
 #quadro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 22px);bottom:0}
 #quadro iframe{display:block;width:100%;height:100%;border:0}
</style>
